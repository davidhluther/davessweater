name: Traffic Actuals

# TomTom corridor flow samples at the daily demand peaks (America/New_York
# ~8 AM, noon, 5 PM, 7 PM; UTC crons sit an hour early in winter — acceptable
# drift, the samples carry their own timestamps). 6 pins x 4 runs = 24 of
# TomTom's 2,500 free calls/day.
on:
  schedule:
    - cron: '7 12 * * *'
    - cron: '7 16 * * *'
    - cron: '7 21 * * *'
    - cron: '7 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sample corridor flow (fail-closed)
        run: python scripts/capture_traffic_actuals.py
        continue-on-error: true
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}

      # Predict→grade loop, ONCE a day, on whichever run happens to be the
      # day's first. The old gate ("UTC hour == 12") silently skipped every
      # day 07-26/27 because GitHub fired the 12:07 cron at 13:49 and 15:08 —
      # cron delays routinely exceed the hour window. Gate on the OUTPUT
      # instead: run iff today's forecast file doesn't exist yet, which any
      # delayed (or manually dispatched) run satisfies exactly once per day.
      # Grade yesterday BEFORE forecasting today. Both scripts are fail-soft;
      # the trailing `|| true` guards the step.
      - name: Grade yesterday, then forecast today + tomorrow (first daily run only)
        run: |
          today="$(TZ=America/New_York date +%F)"
          if [ ! -f "data/traffic/forecast/${today}.json" ]; then
            python scripts/compare_traffic.py || true
            python scripts/forecast_traffic.py || true
          else
            echo "Forecast for ${today} already exists; skipping traffic model."
          fi
        continue-on-error: true

      - name: Commit sample
        run: |
          git config user.name "DavesSweaterBot"
          git config user.email "bot@davessweater.com"
          git add data/traffic/
          git commit -m "Traffic actuals sample $(date -u +%Y-%m-%dT%H:%MZ)" || echo "No changes to commit"
          git pull origin main --no-rebase -X ours || true
          git push origin main || (sleep 5 && git pull origin main --no-rebase -X ours && git push origin main)
