name: Traffic Actuals

# TomTom corridor flow samples at the daily demand peaks (America/New_York
# ~8 AM, noon, 5 PM, 7 PM; UTC crons sit an hour early in winter — acceptable
# drift, the samples carry their own timestamps). 6 pins x 4 runs = 24 of
# TomTom's 2,500 free calls/day.
#
# ⚠️ THE DATASET DOES NOT LIVE IN THIS REPO (changed 2026-08-13). This repo is
# public and its data/ tree is published under CC BY 4.0; TomTom's Portal Terms
# (11.4 caching, 11.6.1 no secondary or derived database, 17.1 ownership) cover
# neither persistent server-side storage of Results nor sublicensing them to
# anyone who clones us. Every layer — raw samples, comparisons, forecast,
# scores — now lives in a PRIVATE companion repo that this job checks out at
# ./private-data and commits back to. Nothing traffic-related is committed here
# any more. Full finding: CHECKLIST.md, "TomTom storage exposure."
#
# Artifacts were considered as a store and rejected: workflow artifacts on a
# public repo are downloadable by anyone, so they would rebuild the exposure.
#
# Inputs: schedule and manual dispatch only. No event-supplied text reaches a
# run: block, so there is no injection surface here.
on:
  schedule:
    - cron: '7 12 * * *'
    - cron: '7 16 * * *'
    - cron: '7 21 * * *'
    - cron: '7 23 * * *'
  workflow_dispatch:

# Read-only against THIS repo now — the job no longer writes anything here. The
# private data repo is written with DS_PRIVATE_DATA_TOKEN instead.
permissions:
  contents: read

env:
  DS_PRIVATE_DATA_DIR: ${{ github.workspace }}/private-data
  # Owner/name of the private companion repo holding the traffic dataset.
  PRIVATE_DATA_REPO: davidhluther/davessweater-data

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Mounts the private dataset at ./private-data (gitignored here). The
      # scripts resolve every traffic path through scripts/traffic_paths.py,
      # which reads DS_PRIVATE_DATA_DIR, so nothing below needs to know the
      # layout. A shallow clone is enough: the pipeline only ever reads the
      # current files, never the history.
      - name: Mount the private traffic store
        id: mount
        env:
          DS_PRIVATE_DATA_TOKEN: ${{ secrets.DS_PRIVATE_DATA_TOKEN }}
        run: |
          if [ -z "${DS_PRIVATE_DATA_TOKEN}" ]; then
            echo "mounted=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DS_PRIVATE_DATA_TOKEN is not set — the private traffic store cannot be mounted, so this run samples nothing."
            exit 0
          fi
          if git clone --depth 1 \
              "https://x-access-token:${DS_PRIVATE_DATA_TOKEN}@github.com/${PRIVATE_DATA_REPO}.git" \
              private-data; then
            echo "mounted=true" >> "$GITHUB_OUTPUT"
            echo "Mounted ${PRIVATE_DATA_REPO} at ./private-data"
          else
            echo "mounted=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not clone the private data repo — check that it exists and the token has access."
          fi

      - name: Sample corridor flow (fail-closed)
        if: steps.mount.outputs.mounted == 'true'
        run: python scripts/capture_traffic_actuals.py
        continue-on-error: true
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}

      # Predict→grade loop, ONCE a day, on whichever run happens to be the
      # day's first. The old gate ("UTC hour == 12") silently skipped every
      # day 07-26/27 because GitHub fired the 12:07 cron at 13:49 and 15:08 —
      # cron delays routinely exceed the hour window. Gate on the OUTPUT
      # instead: run iff today's forecast file doesn't exist yet, which any
      # delayed (or manually dispatched) run satisfies exactly once per day.
      # Grade yesterday BEFORE forecasting today. Both scripts are fail-soft;
      # the trailing `|| true` guards the step.
      - name: Grade yesterday, then forecast today + tomorrow (first daily run only)
        if: steps.mount.outputs.mounted == 'true'
        run: |
          today="$(TZ=America/New_York date +%F)"
          if [ ! -f "${DS_PRIVATE_DATA_DIR}/traffic/forecast/${today}.json" ]; then
            python scripts/compare_traffic.py || true
            python scripts/forecast_traffic.py || true
          else
            echo "Forecast for ${today} already exists; skipping traffic model."
          fi
        continue-on-error: true

      # Commits into the PRIVATE repo, never this one. Same collision handling
      # as before (the four daily runs plus a manual dispatch can overlap).
      - name: Commit sample to the private data repo
        if: steps.mount.outputs.mounted == 'true'
        working-directory: private-data
        run: |
          git config user.name "DavesSweaterBot"
          git config user.email "bot@davessweater.com"
          git add traffic/
          git commit -m "Traffic actuals sample $(date -u +%Y-%m-%dT%H:%MZ)" || echo "No changes to commit"
          git pull origin HEAD --no-rebase -X ours || true
          git push || (sleep 5 && git pull origin HEAD --no-rebase -X ours && git push)

      # The predict→grade backstop that used to live only in the public
      # sentinel. The sentinel cannot see this dataset any more, so the check
      # runs here, where the store is mounted. --traffic-only also treats an
      # unmounted store as a failure, which is what makes the interim state
      # below loud rather than silent.
      - name: Traffic freshness backstop
        if: steps.mount.outputs.mounted == 'true'
        run: python scripts/check_freshness.py --traffic-only

      # Until the private repo and its token exist, every run above is skipped.
      # That is a real outage of the dataset, so the job goes red rather than
      # reporting a green run that captured nothing.
      - name: Fail when the private store is missing
        if: steps.mount.outputs.mounted != 'true'
        run: |
          echo "The private traffic store is not mounted, so no sample was taken or stored."
          echo "Owner steps: create the private companion repo, seed it with the traffic/"
          echo "tree from the local private-data directory, then add a repo secret"
          echo "DS_PRIVATE_DATA_TOKEN with read/write access to it."
          echo "Background: CHECKLIST.md, 'TomTom storage exposure'."
          exit 1
