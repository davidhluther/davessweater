name: "📸 Daily Capture"

on:
  schedule:
    - cron: '0 10 * * *'  # 6:00 AM EDT / 5:00 AM EST — early so the site shows today's forecasts by morning traffic
  workflow_dispatch:        # manual trigger for testing

permissions:
  contents: write

# Shares the data-writing concurrency group so it never runs at the same time as
# the compare / upload workflows (all of them push data/ to main).
concurrency:
  group: davessweater-data
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch Substack RSS feed
        run: python scripts/fetch_substack.py
        continue-on-error: true

      - name: Capture Ray's Weather forecast
        run: python scripts/capture_rays.py
        continue-on-error: true

      - name: Capture Open-Meteo forecast
        run: python scripts/capture_openmeteo.py --forecast

      - name: Capture iPhone Weather (Open-Meteo fallback)
        run: python scripts/capture_iphone_weather.py
        continue-on-error: true

      # Roads v1: forecast tomorrow's road conditions from our own Open-Meteo
      # capture, then pull DriveNC conditions/incidents + NPS Parkway alerts.
      - name: Forecast road conditions (from Open-Meteo)
        run: python scripts/roads.py
        continue-on-error: true

      - name: Capture DriveNC road conditions + NPS Parkway alerts
        run: python scripts/capture_roads.py
        continue-on-error: true
        env:
          DRIVENC_API_KEY: ${{ secrets.DRIVENC_API_KEY }}
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}

      - name: Capture fireworks forecast (seasonal; self-gating outside late June-July 5)
        run: python scripts/capture_fireworks_forecast.py
        continue-on-error: true

      - name: Capture free forecasters (NWS, Met.no, OWM, WeatherAPI, Visual Crossing, Tomorrow.io, Google)
        run: python scripts/capture_sources.py
        continue-on-error: true
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          VISUALCROSSING_KEY: ${{ secrets.VISUALCROSSING_KEY }}
          TOMORROW_API_KEY: ${{ secrets.TOMORROW_API_KEY }}
          GOOGLE_WEATHER_API_KEY: ${{ secrets.GOOGLE_WEATHER_API_KEY }}

      # M5 P0 (silent): per-town captures at each registry location's own
      # coordinates. Best-effort — a town or source failing never blocks Boone.
      # --fill-missing makes the step idempotent: a re-run (manual dispatch
      # after a partial sweep) only fetches what's absent for today, never
      # overwriting the morning's successful captures. On a normal first run
      # nothing exists yet, so behavior is identical.
      - name: Capture location forecasts (all registry towns)
        run: python scripts/capture_locations.py --fill-missing
        continue-on-error: true
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          VISUALCROSSING_KEY: ${{ secrets.VISUALCROSSING_KEY }}
          TOMORROW_API_KEY: ${{ secrets.TOMORROW_API_KEY }}
          GOOGLE_WEATHER_API_KEY: ${{ secrets.GOOGLE_WEATHER_API_KEY }}

      # M5 P0.5: Ray's per-town numbers — ONE unauthenticated public-API call
      # for all towns (owner-approved once-daily, 2026-07-18).
      - name: Capture Ray's per-town forecasts
        run: python scripts/capture_rays_locations.py
        continue-on-error: true

      # Tourism forecast v0 (silent accrual): lodging prices for future weekend
      # stays via the keyless Xotelo API. Script always exits 0 (fail-closed).
      - name: Capture lodging demand (tourism forecast v0)
        run: python scripts/capture_lodging_demand.py
        continue-on-error: true

      # Tourism forecast v0: STR booking pace (AirROI, owner-approved paid key;
      # market-level stats only, attribution carried in-file). Exits 0 w/o key.
      - name: Capture STR booking pace (tourism forecast v0)
        run: python scripts/capture_str_pacing.py
        continue-on-error: true
        env:
          AIRROI_API_KEY: ${{ secrets.AIRROI_API_KEY }}

      # Weather events for tourism/traffic: NWS watches+warnings for the six
      # tracked counties (keyless). Fail-closed; always exits 0.
      - name: Capture NWS alerts (weather events)
        run: python scripts/capture_wx_alerts.py
        continue-on-error: true

      # Tourism/traffic events: App State athletics ICS feeds (football + hoops)
      # from the verified registry. Fail-closed per feed; always exits 0.
      - name: Capture App State athletics (ICS events)
        run: python scripts/capture_events_ics.py
        continue-on-error: true

      # Campus-wide events (Localist, keyless): Holmes Center concerts, theatre,
      # commencement — the demand events athletics ICS misses. Exits 0 on failure.
      - name: Capture campus events (Localist)
        run: python scripts/capture_campus_events.py
        continue-on-error: true

      # Wikipedia pageviews (official API, keyless): regional attention proxy.
      - name: Capture Wikipedia attention
        run: python scripts/capture_wiki_attention.py
        continue-on-error: true

      # USGS river gauges (public domain): recreation-demand + flood-risk axis.
      - name: Capture river gauges (USGS)
        run: python scripts/capture_river_gauges.py
        continue-on-error: true

      # left917.net published event calendar (partner site; hyperlocal community
      # layer for Watauga/Ashe/Avery). Their ICS TTL is hourly; daily is polite.
      - name: Capture left917 events (partner ICS)
        run: python scripts/capture_left917_events.py
        continue-on-error: true

      # Calibration: Blue Ridge Parkway monthly visitation (NPS Stats API,
      # keyless). Self-gates to one pull a month (the 3rd); exits 0 otherwise.
      - name: Capture NPS Blue Ridge Parkway visitation (monthly)
        run: python scripts/capture_nps_visits.py
        continue-on-error: true

      # Event magnitude: races within 40mi of Boone (RunSignup open API,
      # keyless). Self-gates to a weekly (Monday) pull; exits 0 otherwise.
      - name: Capture nearby races (RunSignup)
        run: python scripts/capture_races.py
        continue-on-error: true

      # Early-warning: keyword scan of Town of Boone CivicPlus calendar + agenda
      # RSS feeds for permitted events/closures. Daily, fail-soft; exits 0.
      - name: Capture Town of Boone event signals (agenda scan)
        run: python scripts/capture_town_signals.py
        continue-on-error: true

      # Leaf model: refresh the published peak-color windows once September
      # temperatures exist. Self-gating by date rather than trusting a human to
      # remember: the model needs 12 captured September days and the Open-Meteo
      # archive trails about six, so the earliest useful run is around Sep 18.
      # It stops after Sep 30 because the anomaly window closes Sep 25 and the
      # answer is settled by then; running past that would only churn published
      # dates for nothing. Outside the window the step is a no-op.
      - name: Refresh leaf peak-color windows (mid-September onward)
        run: |
          TODAY=$(TZ=America/New_York date +%m-%d)
          if [[ "$TODAY" > "09-17" && "$TODAY" < "10-01" ]]; then
            echo "In the refresh window ($TODAY); rerunning the leaf model."
            python scripts/predict_leaf.py --refresh
          else
            echo "Outside the Sep 18-30 refresh window ($TODAY); leaving predictions as they are."
          fi
        continue-on-error: true

      # Leaf grading: rescore the published windows against whatever observations
      # have been recorded by hand in data/leaf/observations.json. Writes an empty
      # scoreboard until the first October observation lands, which is correct.
      - name: Score leaf peak-color windows
        run: python scripts/score_leaf.py
        continue-on-error: true

      # Busy-ness Index v0: 14-day forward regional demand score built from the
      # hotel, STR, events, alerts, and forecast captures above, plus the leaf
      # model's per-town peak windows. Fail-soft; exits 0.
      - name: Compute Busy-ness Index (tourism forecast v0)
        run: python scripts/compute_busyness.py
        continue-on-error: true

      - name: Commit captures
        run: |
          git config user.name "DavesSweaterBot"
          git config user.email "bot@davessweater.com"
          git add data/predictions/ data/locations/ data/demand/ data/alerts/ data/events/ data/attention/ data/rivers/ data/calibration/ data/leaf/ data/substack_feed.json data/fireworks_forecast.json data/roads_forecast.json data/road_conditions/
          git commit -m "Daily capture $(date +%Y-%m-%d)" || echo "No changes to commit"
          git pull origin main --no-rebase -X ours || true
          git push origin main || (sleep 5 && git pull origin main --no-rebase -X ours && git push origin main)
