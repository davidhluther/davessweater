name: "🚨 Freshness Sentinel"

# Independent of the daily_capture / daily_compare jobs on purpose: their own
# in-run health check (check_capture_health.py) only fires if they actually run.
# If a cron is silently skipped (Actions outage, a disabled workflow, a bad
# schedule edit) nothing runs, so nothing fails, and the site goes stale with
# every other check still green - the 2026-07-02 failure mode. This workflow
# runs on its own late-morning schedule and reads the committed data instead,
# so a skipped run still gets caught.
#
# When it runs (changed 2026-11-16). It used to run on its own 16:30 UTC cron,
# assumed to be "safely after" the 10:00 UTC capture. GitHub fires this repo's
# crons four to ten hours late (capture created 16:06-20:26 UTC through 11/16),
# so the sentinel only passed because it was late too: a manual run at 16:27
# UTC on 11/16 failed with no predictions/2026-11-16/ directory. Now:
#   1. workflow_run: it runs when Daily Capture completes (success or failure),
#      so it checks today's capture after it has been committed, never before.
#   2. A late-evening backstop cron catches a capture that never fired at all.
#      It runs check_freshness.py --backstop, which checks the most recent
#      Eastern day whose capture should be done, so a backstop GitHub delays
#      past midnight does not false-alarm on a day that has not been captured yet.
#
# It also owns the traffic freshness check (moved here from traffic_actuals.yml
# 2026-11-16, Argon D8): that check used to run only inside the job it guards,
# so a missed traffic cron alerted nobody. The sentinel clones the private
# traffic store read-only with the same deploy key and runs --traffic-only,
# which treats an unmounted store as a failure.
#
# No untrusted input reaches this workflow (schedule + manual dispatch only,
# no PR/issue-triggered event data), and it never writes to either repo.
on:
  workflow_run:
    workflows: ["📸 Daily Capture"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '47 23 * * *'  # backstop: 6:47 PM EST / 7:47 PM EDT, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

env:
  DS_PRIVATE_DATA_DIR: ${{ github.workspace }}/private-data
  PRIVATE_DATA_REPO: davidhluther/davessweater-data

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # ref: main so a workflow_run trigger sees the capture's own commit.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Read-only: this must never commit. It only reads data/ and exits
      # non-zero (a loud red run + notification) when the pipeline looks stale.
      # The backstop cron checks the most recent settled day; every other
      # trigger (capture completion, manual dispatch) checks today.
      - name: Check pipeline freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python scripts/check_freshness.py --backstop
          else
            python scripts/check_freshness.py
          fi

      # Read-only shallow clone of the private traffic store. No commit or push
      # ever happens from this job. A missing key or failed clone is left for
      # the next step to report as a failure.
      - name: Mount the private traffic store (read-only)
        if: always()
        env:
          DS_PRIVATE_DATA_KEY: ${{ secrets.DS_PRIVATE_DATA_KEY }}
        run: |
          if [ -z "${DS_PRIVATE_DATA_KEY}" ]; then
            echo "::warning::DS_PRIVATE_DATA_KEY is not set; the traffic check below will fail."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${DS_PRIVATE_DATA_KEY}" > ~/.ssh/ds_data_key
          chmod 600 ~/.ssh/ds_data_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/ds_data_key -o IdentitiesOnly=yes" \
            git clone --depth 1 "git@github.com:${PRIVATE_DATA_REPO}.git" private-data \
            || echo "::warning::Could not clone the private data repo; the traffic check below will fail."
          rm -f ~/.ssh/ds_data_key

      # Runs even when the weather check above failed, so both report.
      # --traffic-only fails when the store is not mounted.
      - name: Check traffic freshness (private store)
        if: always()
        run: python scripts/check_freshness.py --traffic-only
